<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>bolsos</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.galeria{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
max-width:1200px;
margin:auto;
}

.galeria img{
width:100%;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.galeria img:hover{
transform:scale(1.03);
}

.volver{
display:block;
width:200px;
margin:30px auto;
text-align:center;
background:black;
color:white;
padding:12px;
text-decoration:none;
border-radius:5px;
}

</style>
</head>

<body>

<h1>bolsos</h1>

<div class="galeria">

<img src="foto1.jpeg">
<img src="imagenes/remera2.jpg">
<img src="imagenes/remera3.jpg">
<img src="imagenes/remera4.jpg">
<img src="imagenes/remera5.jpg">
<img src="imagenes/remera6.jpg">

</div>

<a href="index.html" class="volver">Volver al catálogo</a>

</body>
</html>
